version: '3.9'
services:

  user-service:
    build: ../services/user-service
    container_name: user-service
    ports:
      - "8000:8000"
    env_file:
      - ../services/user-service/user.env
    depends_on:
      - postgres
      - redis

  product-service:
    build: ../services/product-service
    container_name: product-service
    ports:
      - "8001:8000"
    env_file:
      - ../services/product-service/product.env
    depends_on:
      - postgres
      - redis

  order-service:
    build: ../services/order-service
    container_name: order-service
    ports:
      - "8002:8000"
    env_file:
      - ../services/order-service/order.env
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
